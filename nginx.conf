server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /ngsw.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 '';
  }
}
